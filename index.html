<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Command Center</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f5f5f7;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .page {
      display: none;
    }
    .page.active {
      display: block;
    }
    .reg-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    h2 {
      margin-bottom: 20px;
      color: #1d1d1f;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      padding: 8px 16px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 12px;
      word-wrap: break-word;
      white-space: pre-wrap;
      vertical-align: middle;
    }
    th {
      background: #f5f5f7;
    }
    td input {
      width: 100%;
      padding: 4px;
      border: none;
      background: transparent;
      text-align: center;
    }
    td input:disabled {
      color: #555;
      background: #eee;
      cursor: not-allowed;
    }
    .edit-btn {
      background: #ff9500;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .save-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .del-btn {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #28a745;
      color: white;
      padding: 15px;
      border-radius: 8px;
      display: none;
      z-index: 10000;
    }
  </style>
</head>
<body>

  <div id="loadingOverlay">處理中...</div>
  <div id="toast">存檔成功！</div>

  <div class="container">
    <div id="loginPage" class="page active">
      <h2>系統驗證</h2>
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail"></div>
      <div class="form-group"><label>密碼</label><input type="password" id="loginCode"></div>
      <button onclick="handleLogin()" style="width:100%;">登入系統</button>
    </div>

    <div id="appPage" class="page">
      <nav style="margin-bottom:20px; display:flex; gap:10px;">
        <button onclick="switchPage('regPage')">登記新券</button>
        <button onclick="switchPage('recordsPage')">流水帳記錄</button>
      </nav>

      <div id="regPage" class="page active">
        <h2>登記新券</h2>
        <div class="reg-grid">
          <div>
            <div class="form-group">
              <label>首碼</label>
              <input type="text" id="regStart" oninput="autoDetect()" onkeypress="if(event.keyCode==13){document.getElementById('regEnd').focus();return false;}">
            </div>
            <div class="form-group">
              <label>尾碼</label>
              <input type="text" id="regEnd" oninput="previewData()">
            </div>
            <div class="form-group">
              <label>填寫訂單號 (必填)</label>
              <input type="text" id="orderNo" required placeholder="請輸入單號">
            </div>
          </div>
          <div>
            <div class="form-group">
              <label>供應商</label>
              <select id="regSupplierSelect" onchange="updateGiftSelect()">
                <option value="">請選擇</option>
              </select>
            </div>
            <div class="form-group">
              <label>禮券項目</label>
              <select id="regGiftSelect" onchange="previewData()">
                <option value="">請選擇</option>
              </select>
            </div>
          </div>
        </div>
        
        <button onclick="previewData()" style="width:100%; background:#6c757d; margin-bottom:15px;">計算並預覽</button>
        
        <div id="previewBox" style="background:#f0f7ff; padding:15px; border-radius:10px; display:none; margin-top:15px;">
          <p><strong>預覽資訊</strong></p>
          <p>供應商: <span id="pSup"></span> | 項目: <span id="pGift"></span></p>
          <p>範圍: <span id="pStart"></span> ~ <span id="pEnd"></span></p>
          <p>有效日期: <span id="pExpiry"></span></p>
          <p>系統計算數量: <strong id="pCount" style="color:red; font-size:18px;"></strong></p>
          <button onclick="confirmSubmit()" style="background:#28a745; width:100%; color:white; padding:10px; border:none; border-radius:5px; margin-top:10px;">確認無誤，正式存檔</button>
        </div>
      </div>

      <div id="recordsPage" class="page">
        <h2>記錄列表 <button onclick="loadRecords()" style="font-size:12px;">重新整理</button></h2>
        <div style="background:#f9f9f9; padding:10px; border-radius:8px; margin-bottom:10px; display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
          <input type="text" id="filterUser" placeholder="篩選人員" oninput="loadRecords()">
          <input type="text" id="filterOrder" placeholder="篩選訂單號" oninput="loadRecords()">
          <input type="date" id="filterDate" onchange="loadRecords()">
          <input type="text" id="filterItem" placeholder="篩選項目" oninput="loadRecords()">
        </div>
        <button onclick="toggleSort()" style="margin-bottom:10px;">切換時間排序</button>
        <table id="recordsTable">
          <thead>
            <tr>
              <th style="width:12%">時間</th>
              <th style="width:12%">供應商</th>
              <th style="width:12%">項目</th>
              <th style="width:12%">首碼</th>
              <th style="width:12%">尾碼</th>
              <th style="width:8%">數量</th>
              <th style="width:8%">人員</th>
              <th style="width:10%">訂單號</th>
              <th style="width:6%">有效期</th>
              <th style="width:10%">操作</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const G_URL = 'https://script.google.com/macros/s/AKfycbxSQ4rGGID2qdsGMILjwhUX1S0ujFmXE9riK9t9opqmuxkC_oAF7zEW1F1RzGddJOs/exec';
    let giftDatabase = [], currentUser = "";
    let sortDesc = true;

    function showToast() {
      const t = document.getElementById('toast');
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }

    function showLoading() {
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    function calculateExpiryDate(rule) {
      if (!rule || rule === 'N/A') return 'N/A';
      if (rule.includes('m_end')) {
        const months = parseInt(rule, 10);
        const date = new Date();
        date.setMonth(date.getMonth() + months + 1);
        date.setDate(0);
        return date.toISOString().split('T')[0];
      }
      return rule;
    }

    function calculateCount(start, end, type) {
      let a = start.replace(/[^0-9]/g, '');
      let b = end.replace(/[^0-9]/g, '');
      let valA, valB;
      if (type === 'suffix_1') {
        valA = parseInt(a.slice(0, -1), 10);
        valB = parseInt(b.slice(0, -1), 10);
      } else if (type === 'suffix_2') {
        valA = parseInt(a.slice(0, -2), 10);
        valB = parseInt(b.slice(0, -2), 10);
      } else if (type === 'suffix_12') {
        valA = parseInt(a.slice(-12), 10);
        valB = parseInt(b.slice(-12), 10);
      } else {
        valA = parseInt(a, 10);
        valB = parseInt(b, 10);
      }
      return Math.abs(valB - valA) + 1;
    }

    // 精確修改：移除引發跨域阻斷的 mode 宣告，改為最原生安全的 get 請求
    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const code = document.getElementById('loginCode').value.trim();
      if (!email || !code) {
        alert('請填寫 Email 與密碼');
        return;
      }
      showLoading();
      try {
        const res = await fetch(`${G_URL}?action=verify&email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`);
        const data = await res.json();
        if (data.success) {
          currentUser = data.name;
          document.getElementById('loginPage').classList.remove('active');
          document.getElementById('appPage').classList.add('active');
          document.getElementById('filterDate').valueAsDate = new Date();
          await loadConfig();
        } else {
          alert('驗證失敗，請檢查帳號密碼');
        }
      } catch (err) {
        alert('連線失敗，請稍後再試');
      } finally {
        hideLoading();
      }
    }

    async function loadConfig() {
      const res = await fetch(`${G_URL}?action=getConfig`);
      giftDatabase = await res.json();
      const suppliers = [...new Set(giftDatabase.map(i => i.supplier))];
      document.getElementById('regSupplierSelect').innerHTML = '<option value="">請選擇</option>' + suppliers.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    function toggleSort() {
      sortDesc = !sortDesc;
      loadRecords();
    }

    function updateGiftSelect() {
      const s = document.getElementById('regSupplierSelect').value;
      const filtered = giftDatabase.filter(i => i.supplier === s);
      document.getElementById('regGiftSelect').innerHTML = '<option value="">請選擇</option>' + filtered.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
      previewData();
    }

    async function autoDetect() {
      const prefix = document.getElementById('regStart').value.trim();
      
      // 5 ~ 19 碼精確區間阻斷
      if (prefix.length < 5 || prefix.length > 19) return;
      
      try {
        const res = await fetch(`${G_URL}?action=detectFields&prefix=${encodeURIComponent(prefix)}`);
        const data = await res.json();
        
        if (data && data.found) {
          document.getElementById('regSupplierSelect').value = data.supplier;
          updateGiftSelect(); 
          document.getElementById('regGiftSelect').value = data.giftName;
          previewData();
        }
      } catch (err) {
        console.error('雙層自動識別連線失敗', err);
      }
    }

    function previewData() {
      const start = document.getElementById('regStart').value.trim();
      const end = document.getElementById('regEnd').value.trim();
      const giftName = document.getElementById('regGiftSelect').value;
      const match = giftDatabase.find(i => i.name === giftName);

      if (match && start && end) {
        document.getElementById('pSup').innerText = match.supplier;
        document.getElementById('pGift').innerText = match.name;
        document.getElementById('pStart').innerText = start;
        document.getElementById('pEnd').innerText = end;
        document.getElementById('pExpiry').innerText = calculateExpiryDate(match.rule1);
        document.getElementById('pCount').innerText = calculateCount(start, end, match.calcType);
        document.getElementById('previewBox').style.display = 'block';
      } else {
        document.getElementById('previewBox').style.display = 'none';
      }
    }

    // 精確優化：使用不帶特殊 Header 的標準 POST 傳輸，徹底避免不相容的 CORS 預檢攔截
    async function confirmSubmit() {
      const orderNo = document.getElementById('orderNo').value.trim();
      const supplier = document.getElementById('regSupplierSelect').value;
      const gift = document.getElementById('regGiftSelect').value;
      const start = document.getElementById('regStart').value.trim();
      const end = document.getElementById('regEnd').value.trim();

      if (!supplier || !gift || !start || !end) {
        alert('請確認供應商、項目、首碼與尾碼皆已完整填寫並完成預覽');
        return;
      }
      if (!orderNo) {
        alert('錯誤：訂單號是系統稽核的關鍵，無訂單號無法存檔！');
        return;
      }

      showLoading();
      try {
        const payload = {
          action: 'insertRecord',
          supplier: supplier,
          gift: gift,
          start: start,
          end: end,
          count: document.getElementById('pCount').innerText,
          user: currentUser,
          orderNo: orderNo,
          expiry: document.getElementById('pExpiry').innerText
        };

        // 改為 text/plain 模式傳送，能完美避開瀏覽器跨域攔截
        await fetch(G_URL, { 
          method: 'POST', 
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        
        document.getElementById('regStart').value = '';
        document.getElementById('regEnd').value = '';
        document.getElementById('orderNo').value = '';
        document.getElementById('regSupplierSelect').value = '';
        document.getElementById('regGiftSelect').innerHTML = '<option value="">請選擇</option>';
        document.getElementById('previewBox').style.display = 'none';
        showToast();
      } catch (err) {
        alert('連線失敗，請稍後再試');
      } finally {
        hideLoading();
      }
    }

    async function loadRecords() {
      showLoading();
      try {
        const res = await fetch(`${G_URL}?action=getRecords`);
        let rawRecords = await res.json();
        let recordsWithObjects = rawRecords.map((r, index) => ({ data: r, oriIndex: index }));
        
        const fUser = document.getElementById('filterUser').value.toLowerCase();
        const fOrder = document.getElementById('filterOrder').value.toLowerCase();
        const fDate = document.getElementById('filterDate').value;
        const fItem = document.getElementById('filterItem').value.toLowerCase();

        recordsWithObjects = recordsWithObjects.filter(item => {
          const r = item.data;
          return r[6].toLowerCase().includes(fUser) && 
                 String(r[7]).toLowerCase().includes(fOrder) && 
                 r[2].toLowerCase().includes(fItem) && 
                 (!fDate || new Date(r[0]).toISOString().split('T')[0] === fDate);
        });

        recordsWithObjects.sort((a, b) => sortDesc ? new Date(b.data[0]) - new Date(a.data[0]) : new Date(a.data[0]) - new Date(b.data[0]));

        document.getElementById('recordsBody').innerHTML = recordsWithObjects.map((item) => {
          const r = item.data;
          const idx = item.oriIndex;
          const isDel = r[8] === "...已登記刪除" || r[8] === "快照/已登記刪除" || r[8] === "已登記刪除";
          const expiryVal = r[9] || 'N/A';
          return `<tr>
            <td>${new Date(r[0]).toLocaleString()}</td>
            <td><input type="text" class="edit-in-${idx}" value="${r[1]}" ${isDel ? 'disabled' : 'readonly'}></td>
            <td><input type="text" class="edit-in-${idx}" value="${r[2]}" ${isDel ? 'disabled' : 'readonly'}></td>
            <td><input type="text" class="edit-in-${idx}" value="${r[3]}" ${isDel ? 'disabled' : 'readonly'}></td>
            <td><input type="text" class="edit-in-${idx}" value="${r[4]}" ${isDel ? 'disabled' : 'readonly'}></td>
            <td>${r[5]}</td>
            <td>${r[6]}</td>
            <td><input type="text" class="edit-in-${idx}" value="${r[7]}" ${isDel ? 'disabled' : 'readonly'}></td>
            <td>${expiryVal}</td>
            <td>${!isDel ? `<button class="edit-btn" id="btn-edit-${idx}" onclick="toggleEdit(${idx})">Edit</button>
                            <button class="save-btn" id="btn-save-${idx}" onclick="saveRow(${idx})" style="display:none">Save</button>
                            <button class="del-btn" onclick="deleteRow(${idx})">刪除</button>` : '已登記刪除'}</td>
          </tr>`;
        }).join('');
      } catch (err) {
        console.error('讀取紀錄失敗', err);
      } finally {
        hideLoading();
      }
    }

    function toggleEdit(i) {
      document.querySelectorAll(`.edit-in-${i}`).forEach(el => el.disabled = false);
      document.getElementById(`btn-edit-${i}`).style.display = 'none';
      document.getElementById(`btn-save-${i}`).style.display = 'inline-block';
    }

    async function saveRow(i) {
      const inputs = document.querySelectorAll(`.edit-in-${i}`);
      const currentGiftName = inputs[1].value;
      const match = giftDatabase.find(item => item.name === currentGiftName);
      const calcType = match ? match.calcType : 'normal';
      const c = calculateCount(inputs[2].value, inputs[3].value, calcType);
      
      showLoading();
      try {
        await fetch(G_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'updateRecord',
            index: i,
            supplier: inputs[0].value,
            gift: inputs[1].value,
            start: inputs[2].value,
            end: inputs[3].value,
            count: c,
            orderNo: inputs[4].value
          }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        loadRecords();
      } catch (err) {
        alert('儲存修改失敗');
        hideLoading();
      }
    }

    async function deleteRow(i) {
      if (!confirm("確認刪除此筆記錄？（刪除後庫存狀態將同步反向歸位）")) return;
      showLoading();
      try {
        await fetch(G_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'markDeleted', index: i }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        loadRecords();
      } catch (err) {
        alert('刪除失敗');
        hideLoading();
      }
    }

    function switchPage(p) {
      document.querySelectorAll('#appPage .page').forEach(e => e.classList.remove('active'));
      document.getElementById(p).classList.add('active');
      if (p === 'recordsPage') loadRecords();
    }
  </script>
</body>
</html>
