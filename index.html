<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Wedding Command Center - 完整版</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #f5f5f7; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; }
        .page { display: none; } .page.active { display: block; }
        .reg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 20px; background: #0071e3; color: white; border: none; border-radius: 6px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <nav style="margin-bottom:20px;">
        <button onclick="switchPage('regPage')">登記新券</button>
        <button onclick="switchPage('arrivalPage')">貨到登記</button>
        <button onclick="switchPage('recordsPage')">流水帳記錄</button>
    </nav>

    <div id="regPage" class="page active">
        <h2>登記新券</h2>
        <div class="reg-grid">
            <input type="text" id="regStart" placeholder="首碼" onblur="dualCheck()">
            <input type="text" id="regEnd" placeholder="尾碼">
            <select id="regSupplierSelect"></select>
            <select id="regGiftSelect"></select>
        </div>
        <input type="text" id="orderNo" placeholder="填寫訂單號 (必填)" style="margin-bottom:10px;">
        <button onclick="confirmSubmit()" style="width:100%; background:#28a745;">正式存檔</button>
    </div>

    <div id="arrivalPage" class="page">
        <h2>貨到登記</h2>
        <select id="arrSupplierSelect"></select>
        <select id="arrGiftSelect"></select>
        <input type="text" id="arrStart" placeholder="首碼">
        <input type="text" id="arrEnd" placeholder="尾碼">
        <button onclick="submitArrival()" style="width:100%;">入庫存</button>
    </div>

    <div id="recordsPage" class="page">
        <h2>流水帳 <button onclick="loadRecords()">刷新</button></h2>
        <table id="recordsTable">
            <thead><tr><th>時間</th><th>供應商</th><th>項目</th><th>首碼</th><th>尾碼</th><th>數量</th><th>訂單</th><th>操作</th></tr></thead>
            <tbody id="recordsBody"></tbody>
        </table>
    </div>
</div>

<script>
    const G_URL = 'https://script.google.com/macros/s/AKfycbx5PR7dAEkprFhjOrHpQTB2FZ0FzPfDX93uxwSSxqRGlEZlMay9LI7BWHu4ew_AAyT-/exec';
    let giftDatabase = [];

    // 初始化與載入設定
    async function loadConfig() {
        const res = await fetch(`${G_URL}?action=getConfig`);
        giftDatabase = await res.json();
        // 此處加入初始化選單邏輯...
    }

    // 雙重檢查識別
    async function dualCheck() {
        const val = document.getElementById('regStart').value;
        if (!val) return;
        const res = await fetch(`${G_URL}?action=checkInventory&code=${val}`);
        const data = await res.json();
        if (data.found) {
            document.getElementById('regSupplierSelect').value = data.brand;
            document.getElementById('regGiftSelect').value = data.product;
        }
    }

    // 正式提交 (對應您後端的 insertRecord)
    async function confirmSubmit() {
        const payload = {
            action: 'insertRecord',
            supplier: document.getElementById('regSupplierSelect').value,
            gift: document.getElementById('regGiftSelect').value,
            start: document.getElementById('regStart').value,
            end: document.getElementById('regEnd').value,
            orderNo: document.getElementById('orderNo').value,
            count: 1 // 根據您的邏輯補上
        };
        await fetch(G_URL, { method: 'POST', body: JSON.stringify(payload) });
        alert("存檔成功");
    }

    // 頁面切換
    function switchPage(p) { 
        document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
        document.getElementById(p).classList.add('active');
    }

    loadConfig();
</script>
</body>
</html>
