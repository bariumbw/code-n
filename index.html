<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Wedding Command Center</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f7; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; }
        .page { display: none; } .page.active { display: block; }
        .reg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 6px; background: #0071e3; color: white; }
        #previewBox { background: #f0f7ff; padding: 15px; border-radius: 10px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <nav style="margin-bottom:20px;">
        <button onclick="switchPage('regPage')">登記新券</button>
        <button onclick="switchPage('recordsPage')">記錄列表</button>
    </nav>

    <div id="regPage" class="page active">
        <h2>登記新券</h2>
        <div class="reg-grid">
            <div class="form-group"><label>首碼</label><input type="text" id="regStart" onblur="dualCheck()"></div>
            <div class="form-group"><label>尾碼</label><input type="text" id="regEnd"></div>
            <div class="form-group"><label>供應商</label><select id="regSupplierSelect"></select></div>
            <div class="form-group"><label>項目</label><select id="regGiftSelect"></select></div>
        </div>
        <button onclick="calculatePreview()" style="width:100%; background:#6c757d; margin-top:10px;">計算並預覽</button>
        
        <div id="previewBox" style="display:none;">
            <p><strong>預覽資訊</strong></p>
            <p id="pInfo"></p>
            <input type="text" id="orderNo" placeholder="填寫訂單號 (必填)" style="margin:10px 0;">
            <button onclick="confirmSubmit()" style="width:100%; background:#28a745;">正式存檔</button>
        </div>
    </div>

    <div id="recordsPage" class="page">
        <h2>記錄列表</h2>
        <table id="recordsTable">
            <thead><tr><th>時間</th><th>供應商</th><th>項目</th><th>首碼</th><th>尾碼</th><th>數量</th><th>訂單</th><th>操作</th></tr></thead>
            <tbody id="recordsBody"></tbody>
        </table>
    </div>
</div>

<script>
    const G_URL = 'https://script.google.com/macros/s/AKfycbx5PR7dAEkprFhjOrHpQTB2FZ0FzPfDX93uxwSSxqRGlEZlMay9LI7BWHu4ew_AAyT-/exec';
    
    // 計算預覽邏輯
    function calculatePreview() {
        const start = document.getElementById('regStart').value;
        const end = document.getElementById('regEnd').value;
        const count = Math.abs(parseInt(end) - parseInt(start)) + 1;
        document.getElementById('pInfo').innerHTML = `範圍: ${start} ~ ${end}<br>系統計算數量: ${count}`;
        document.getElementById('previewBox').style.display = 'block';
    }

    // 雙重檢查與自動填寫
    async function dualCheck() {
        const val = document.getElementById('regStart').value;
        if (!val) return;
        const res = await fetch(`${G_URL}?action=checkInventory&code=${val}`);
        const data = await res.json();
        if (data.found) {
            document.getElementById('regSupplierSelect').value = data.brand;
            document.getElementById('regGiftSelect').value = data.product;
        }
    }

    async function confirmSubmit() {
        // 這裡對應您後端的 insertRecord
        const payload = {
            action: 'insertRecord',
            supplier: document.getElementById('regSupplierSelect').value,
            gift: document.getElementById('regGiftSelect').value,
            start: document.getElementById('regStart').value,
            end: document.getElementById('regEnd').value,
            orderNo: document.getElementById('orderNo').value
        };
        await fetch(G_URL, { method: 'POST', body: JSON.stringify(payload) });
        alert("存檔成功");
    }

    function switchPage(p) { 
        document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
        document.getElementById(p).classList.add('active');
    }
</script>
</body>
</html>
