<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Command Center</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f5f7; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .page { display: none; } .page.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 8px; }
        button { padding: 10px 20px; background: #0071e3; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>

<div id="loadingOverlay">處理中...</div>

<div class="container">
    <div id="loginPage" class="page active">
        <h2>系統驗證</h2>
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail"></div>
        <div class="form-group"><label>密碼</label><input type="password" id="loginCode"></div>
        <button onclick="handleLogin()">登入系統</button>
    </div>

    <div id="appPage" class="page">
        <nav style="margin-bottom:20px;">
            <button onclick="switchPage('regPage')">登記新券</button>
            <button onclick="switchPage('arrivalPage')">貨到登記</button>
        </nav>

        <div id="regPage" class="page active">
            <h2>登記新券 (使用)</h2>
            <div class="form-group"><label>首碼</label><input type="text" id="regStart" onblur="dualCheck()"></div>
            <div class="form-group"><label>尾碼</label><input type="text" id="regEnd"></div>
            <div class="form-group"><label>供應商</label><select id="regSupplierSelect"></select></div>
            <div class="form-group"><label>禮券項目</label><select id="regGiftSelect"></select></div>
            <div class="form-group"><label>訂單號</label><input type="text" id="orderNo"></div>
            <button onclick="confirmSubmit()" style="background:#28a745; width:100%;">確認登記扣庫存</button>
        </div>

        <div id="arrivalPage" class="page">
            <h2>貨到登記</h2>
            <div class="form-group"><label>供應商</label><select id="arrSupplierSelect"></select></div>
            <div class="form-group"><label>禮券項目</label><select id="arrGiftSelect"></select></div>
            <div class="form-group"><label>首碼</label><input type="text" id="arrStart"></div>
            <div class="form-group"><label>尾碼</label><input type="text" id="arrEnd"></div>
            <button onclick="submitArrival()" style="width:100%;">入庫存</button>
        </div>
    </div>
</div>

<script>
    // --- 務必確認網址正確 ---
    const G_URL = 'https://script.google.com/macros/s/AKfycbx5PR7dAEkprFhjOrHpQTB2FZ0FzPfDX93uxwSSxqRGlEZlMay9LI7BWHu4ew_AAyT-/exec';
    let giftDatabase = [];

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const code = document.getElementById('loginCode').value;
        const res = await fetch(`${G_URL}?action=verify&email=${email}&code=${code}`);
        const data = await res.json();
        if (data.success) {
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('appPage').classList.add('active');
            loadConfig();
        } else alert('驗證失敗');
    }

    // 雙重檢查：先查庫存，若無則查規則
    async function dualCheck() {
        const val = document.getElementById('regStart').value.trim();
        if (!val) return;
        showLoading();
        const res = await fetch(`${G_URL}?action=checkInventory&code=${val}`);
        const data = await res.json();
        if (data.found) {
            document.getElementById('regSupplierSelect').value = data.brand;
            document.getElementById('regGiftSelect').value = data.product;
        }
        hideLoading();
    }

    async function confirmSubmit() {
        const start = document.getElementById('regStart').value;
        // 先防重複檢查
        const res = await fetch(`${G_URL}?action=checkDuplicate&start=${start}`);
        const dup = await res.json();
        if(dup.isDuplicate) { alert("此編號已登記過！"); return; }
        
        showLoading();
        const payload = { 
            action: 'updateUsageStatus', 
            brand: document.getElementById('regSupplierSelect').value, 
            product: document.getElementById('regGiftSelect').value, 
            start: start, 
            end: document.getElementById('regEnd').value, 
            orderNo: document.getElementById('orderNo').value 
        };
        await fetch(G_URL, { method: 'POST', body: JSON.stringify(payload) });
        alert("登記成功，庫存已更新");
        hideLoading();
    }

    async function submitArrival() {
        showLoading();
        const payload = { 
            action: 'batchRegisterArrival', 
            brand: document.getElementById('arrSupplierSelect').value, 
            product: document.getElementById('arrGiftSelect').value, 
            start: document.getElementById('arrStart').value, 
            end: document.getElementById('arrEnd').value 
        };
        await fetch(G_URL, { method: 'POST', body: JSON.stringify(payload) });
        alert("入庫成功");
        hideLoading();
    }

    async function loadConfig() {
        const res = await fetch(`${G_URL}?action=getConfig`);
        giftDatabase = await res.json();
        // 初始化下拉選單...
    }

    function switchPage(p) { document.querySelectorAll('#appPage .page').forEach(e => e.classList.remove('active')); document.getElementById(p).classList.add('active'); }
    function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }
</script>
</body>
</html>
