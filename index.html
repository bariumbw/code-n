<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Command Center</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f5f5f7; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 1000px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .page { display: none; }
        .page.active { display: block; }
        .reg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        h2 { margin-bottom: 20px; color: #1d1d1f; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; }
        button { padding: 8px 16px; background: #0071e3; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 12px; word-wrap: break-word; vertical-align: middle; }
        th { background: #f5f5f7; }
        td input { width: 100%; padding: 4px; border: none; background: transparent; text-align: center; }
        .edit-btn { background: #ff9500; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .save-btn { background: #28a745; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .del-btn { background: #ff3b30; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; }
        #toast { position: fixed; top: 20px; right: 20px; background: #28a745; color: white; padding: 15px; border-radius: 8px; display: none; z-index: 10000; }
    </style>
</head>
<body>

<div id="loadingOverlay">處理中...</div>
<div id="toast">操作成功！</div>

<div class="container">
    <div id="loginPage" class="page active">
        <h2>系統驗證</h2>
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail"></div>
        <div class="form-group"><label>密碼</label><input type="password" id="loginCode"></div>
        <button onclick="handleLogin()" style="width:100%;">登入系統</button>
    </div>

    <div id="appPage" class="page">
        <nav style="margin-bottom:20px; display:flex; gap:10px;">
            <button onclick="switchPage('regPage')">登記新券</button>
            <button onclick="switchPage('arrivalPage')">貨到登記</button>
            <button onclick="switchPage('recordsPage')">流水帳記錄</button>
        </nav>

        <div id="regPage" class="page active">
            <h2>登記新券</h2>
            <div class="reg-grid">
                <div>
                    <div class="form-group"><label>首碼</label><input type="text" id="regStart" oninput="autoDetect(); previewData()"></div>
                    <div class="form-group"><label>尾碼</label><input type="text" id="regEnd" oninput="previewData()"></div>
                </div>
                <div>
                    <div class="form-group"><label>供應商</label><select id="regSupplierSelect" onchange="updateGiftSelect()"><option value="">請選擇</option></select></div>
                    <div class="form-group"><label>禮券項目</label><select id="regGiftSelect" onchange="previewData()"><option value="">請選擇</option></select></div>
                </div>
            </div>
            <button onclick="previewData()" style="width:100%; background:#6c757d; margin-bottom:15px;">計算並預覽</button>
            <div id="previewBox" style="background:#f0f7ff; padding:15px; border-radius:10px; display:none;">
                <p>供應商: <span id="pSup"></span> | 項目: <span id="pGift"></span></p>
                <p>範圍: <span id="pStart"></span> ~ <span id="pEnd"></span> | 有效期: <span id="pExpiry"></span></p>
                <p>系統計算數量: <strong id="pCount" style="color:red; font-size:18px;"></strong></p>
                <div class="form-group" style="margin-top:10px;"><label>訂單號 (必填)</label><input type="text" id="orderNo"></div>
                <button onclick="confirmSubmit()" style="background:#28a745; width:100%;">正式存檔</button>
            </div>
        </div>

        <div id="arrivalPage" class="page">
            <h2>貨到登記</h2>
            <div class="reg-grid">
                <div class="form-group"><label>供應商</label><select id="arrSupplierSelect" onchange="updateArrGiftSelect()"><option value="">請選擇</option></select></div>
                <div class="form-group"><label>禮券項目</label><select id="arrGiftSelect"><option value="">請選擇</option></select></div>
            </div>
            <div class="form-group"><label>首碼</label><input type="text" id="arrStart"></div>
            <div class="form-group"><label>尾碼</label><input type="text" id="arrEnd"></div>
            <button onclick="submitArrival()" style="width:100%; background:#0071e3;">存入庫存</button>
        </div>

        <div id="recordsPage" class="page">
            <h2>記錄列表 <button onclick="loadRecords()">重新整理</button></h2>
            <table id="recordsTable">
                <thead><tr><th>時間</th><th>供應商</th><th>項目</th><th>首碼</th><th>尾碼</th><th>數量</th><th>訂單號</th><th>操作</th></tr></thead>
                <tbody id="recordsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const G_URL = 'https://script.google.com/macros/s/AKfycbyaNhmrSWqrYEy03ZqY-Ksy2Pqpm-nQsZlwyKsC83PI8IU7uenwCyIlZ5FFJn6Gxph3/exec';
    let giftDatabase = [], currentUser = "";

    // --- 基礎邏輯與舊有計算 ---
    async function handleLogin() {
        showLoading();
        const res = await fetch(`${G_URL}?action=verify&email=${document.getElementById('loginEmail').value}&code=${document.getElementById('loginCode').value}`);
        const data = await res.json();
        if (data.success) {
            currentUser = data.name;
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('appPage').classList.add('active');
            await loadConfig();
            hideLoading();
        } else { alert('驗證失敗'); hideLoading(); }
    }

    async function loadConfig() {
        const res = await fetch(`${G_URL}?action=getConfig`);
        giftDatabase = await res.json();
        const sups = [...new Set(giftDatabase.map(i => i.supplier))];
        const sHtml = '<option value="">請選擇</option>' + sups.map(s => `<option value="${s}">${s}</option>`).join('');
        document.getElementById('regSupplierSelect').innerHTML = sHtml;
        document.getElementById('arrSupplierSelect').innerHTML = sHtml;
    }

    function calculateCount(start, end, type) {
        let a = start.replace(/[^0-9]/g, ''), b = end.replace(/[^0-9]/g, '');
        if (type === 'suffix_1') return Math.abs(parseInt(b.slice(0,-1)) - parseInt(a.slice(0,-1))) + 1;
        if (type === 'suffix_2') return Math.abs(parseInt(b.slice(0,-2)) - parseInt(a.slice(0,-2))) + 1;
        return Math.abs(parseInt(b) - parseInt(a)) + 1;
    }

    // --- 新舊整合邏輯 ---
    function updateGiftSelect() {
        const s = document.getElementById('regSupplierSelect').value;
        document.getElementById('regGiftSelect').innerHTML = '<option value="">請選擇</option>' + giftDatabase.filter(i => i.supplier === s).map(g => `<option value="${g.name}">${g.name}</option>`).join('');
    }

    function updateArrGiftSelect() {
        const s = document.getElementById('arrSupplierSelect').value;
        document.getElementById('arrGiftSelect').innerHTML = '<option value="">請選擇</option>' + giftDatabase.filter(i => i.supplier === s).map(g => `<option value="${g.name}">${g.name}</option>`).join('');
    }

    function previewData() {
        const match = giftDatabase.find(i => i.name === document.getElementById('regGiftSelect').value);
        if (match && document.getElementById('regStart').value && document.getElementById('regEnd').value) {
            document.getElementById('pSup').innerText = match.supplier;
            document.getElementById('pGift').innerText = match.name;
            document.getElementById('pStart').innerText = document.getElementById('regStart').value;
            document.getElementById('pEnd').innerText = document.getElementById('regEnd').value;
            document.getElementById('pCount').innerText = calculateCount(document.getElementById('regStart').value, document.getElementById('regEnd').value, match.calcType);
            document.getElementById('previewBox').style.display = 'block';
        }
    }

    async function confirmSubmit() {
        showLoading();
        // 優先執行庫存扣除與使用登記
        await fetch(G_URL, { method: 'POST', body: JSON.stringify({ action: 'updateUsageStatus', brand: document.getElementById('regSupplierSelect').value, product: document.getElementById('regGiftSelect').value, start: document.getElementById('regStart').value, end: document.getElementById('regEnd').value, orderNo: document.getElementById('orderNo').value }) });
        // 同步寫入流水帳
        await fetch(G_URL, { method: 'POST', body: JSON.stringify({ action: 'insertRecord', supplier: document.getElementById('regSupplierSelect').value, gift: document.getElementById('regGiftSelect').value, start: document.getElementById('regStart').value, end: document.getElementById('regEnd').value, count: document.getElementById('pCount').innerText, user: currentUser, orderNo: document.getElementById('orderNo').value }) });
        hideLoading();
        alert("登記成功！");
    }

    async function submitArrival() {
        showLoading();
        await fetch(G_URL, { method: 'POST', body: JSON.stringify({ action: 'batchRegisterArrival', brand: document.getElementById('arrSupplierSelect').value, product: document.getElementById('arrGiftSelect').value, start: document.getElementById('arrStart').value, end: document.getElementById('arrEnd').value }) });
        hideLoading();
        alert("到貨登記成功！");
    }

    async function loadRecords() {
        const res = await fetch(`${G_URL}?action=getRecords`);
        const data = await res.json();
        document.getElementById('recordsBody').innerHTML = data.map((r, i) => `<tr><td>${new Date(r[0]).toLocaleString()}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[7]}</td><td><button class="del-btn" onclick="deleteRow(${i})">刪除</button></td></tr>`).join('');
    }

    function switchPage(p) {
        document.querySelectorAll('#appPage .page').forEach(e => e.classList.remove('active'));
        document.getElementById(p).classList.add('active');
        if(p === 'recordsPage') loadRecords();
    }
    
    function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }
</script>
</body>
</html>
