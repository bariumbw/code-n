<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 bg-gray-50">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-xl font-bold mb-4">Wedding Command Center</h1>
        
        <div class="space-y-4">
            <input id="prefix" placeholder="首碼" class="border p-2 w-full" oninput="checkMatch()">
            <input id="suffix" placeholder="尾碼" class="border p-2 w-full">
            <input id="orderId" placeholder="訂單號" class="border p-2 w-full">
            <button onclick="submitRecord()" class="bg-blue-600 text-white px-4 py-2 w-full">正式存檔</button>
        </div>
    </div>

    <script>
        function checkMatch() {
            const prefix = document.getElementById('prefix').value;
            if(prefix.length < 3) return;
            google.script.run.withSuccessHandler(data => {
                if(data.found) alert('已識別供應商: ' + data.supplier);
            }).getInventoryMatch(prefix);
        }

        function submitRecord() {
            const data = {
                supplier: '範例', // 應從 checkMatch 取得並儲存
                giftName: '範例',
                start: document.getElementById('prefix').value,
                end: document.getElementById('suffix').value,
                user: 'Admin',
                orderId: document.getElementById('orderId').value
            };
            google.script.run.withSuccessHandler(() => alert('存檔成功')).saveRecord(data);
        }
    </script>
</body>
</html>
